name: Generate Metrics

on:
  schedule:
    - cron: '0 10 * * *'  # Runs daily at 10:00 UTC (~5-6am ET)
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: output-branch-push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ steps.app-token.outputs.token }}
          user: JacobPEvans
          template: classic
          base: header, activity, community, repositories
          config_timezone: America/Detroit

          # Reef Green identity (matches docs.jacobpevans.com)
          # format: text;text;bg;link;border;icon
          base_colors: 4FB3A9;F4EFE6;0B1D2A;4FB3A9;2F7E78;E06B4A

          # Recent activity
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: all
          plugin_activity_visibility: public

          # Languages
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_colors: github
          plugin_languages_limit: 8

          # Habits (coding patterns)
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_days: 14

          # Output
          filename: metrics.svg
          output_action: commit
          committer_branch: output
          committer_message: "chore: update metrics"

name: Generate Snake Animation

on:
  schedule:
    - cron: '0 12 * * *'  # Runs daily at 12:00 UTC (~7am ET)
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-validate-{0}', github.run_id) || 'output-branch-push' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Commit signed via Contents API
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v9
        env:
          TARGET_BRANCH: output
          COMMIT_MESSAGE: "chore: update snake animation"
          DIRECTORY: dist
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const run = require('./.github/scripts/commit-files-to-branch.js');
            await run({ github, context, core });

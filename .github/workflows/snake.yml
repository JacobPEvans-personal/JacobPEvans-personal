name: Generate Snake Animation

on:
  schedule:
    - cron: '0 12 * * *'  # Runs daily at 12:00 UTC (~7am ET)
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.GH_ACTION_JACOBPEVANS_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          ref: output
          token: ${{ steps.app-token.outputs.token }}

      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Configure Git for App
        env:
          APP_ID: ${{ vars.GH_ACTION_JACOBPEVANS_APP_ID }}
        run: |
          git config user.name "JacobPEvans-github-actions[bot]"
          git config user.email "${APP_ID}+JacobPEvans-github-actions[bot]@users.noreply.github.com"

      - name: Commit and Push
        run: |
          git add dist/
          git diff --staged --quiet || git commit -m "chore: update snake animation"
          git push origin output

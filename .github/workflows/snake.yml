name: Generate Snake Animation

on:
  schedule:
    - cron: '0 12 * * *'  # Runs daily at 12:00 UTC (~7am ET)
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: output-branch-push
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          ref: output
          token: ${{ steps.app-token.outputs.token }}

      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/img/github-snake.svg
            assets/img/github-snake-dark.svg?palette=github-dark

      - name: Open signed PR to output
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: output
          branch: bot/snake-update
          delete-branch: true
          sign-commits: true
          commit-message: "chore: update snake animation"
          title: "chore: update snake animation"
          body: "Automated daily snake animation refresh."
          add-paths: assets/img/

      - name: Squash-merge the PR
        if: steps.cpr.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr merge "$PR" -R ${{ github.repository }} --squash --delete-branch

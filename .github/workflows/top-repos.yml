name: Update Top Active Repos

on:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 2 AM
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-top-repos:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Generate Top Active Repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: |
          # Get date 30 days ago
          SINCE_DATE=$(date -d '30 days ago' '+%Y-%m-%dT00:00:00Z' 2>/dev/null || date -v-30d '+%Y-%m-%dT00:00:00Z')

          # Query merged PRs across all user repos in last 30 days
          echo "Fetching merged PRs since $SINCE_DATE..."

          # Get all repos and count merged PRs for each
          gh api graphql -f query='
            query($user: String!) {
              user(login: $user) {
                repositories(first: 100, ownerAffiliations: OWNER, orderBy: {field: UPDATED_AT, direction: DESC}) {
                  nodes {
                    name
                    url
                    description
                    stargazerCount
                    pullRequests(states: MERGED, first: 100, orderBy: {field: UPDATED_AT, direction: DESC}) {
                      nodes {
                        mergedAt
                      }
                      totalCount
                    }
                  }
                }
              }
            }
          ' -f user="$GITHUB_USER" > /tmp/repos.json

          # Process and count PRs merged in last 30 days, output top 5
          cat > /tmp/process.py << 'PYTHON_SCRIPT'
          import json
          import sys
          from datetime import datetime, timedelta, timezone

          with open('/tmp/repos.json') as f:
              data = json.load(f)

          since = datetime.now(timezone.utc) - timedelta(days=30)
          repos = data['data']['user']['repositories']['nodes']

          results = []
          for repo in repos:
              if not repo['pullRequests']['nodes']:
                  continue
              count = 0
              for pr in repo['pullRequests']['nodes']:
                  if pr['mergedAt']:
                      merged = datetime.fromisoformat(pr['mergedAt'].replace('Z', '+00:00'))
                      if merged >= since:
                          count += 1
              if count > 0:
                  results.append({
                      'name': repo['name'],
                      'url': repo['url'],
                      'description': repo['description'] or 'No description',
                      'stars': repo['stargazerCount'],
                      'merged_prs': count
                  })

          # Sort by merged PRs, take top 5
          results.sort(key=lambda x: x['merged_prs'], reverse=True)
          top5 = results[:5]

          # Generate markdown
          lines = []
          for i, repo in enumerate(top5, 1):
              emoji = ['🥇', '🥈', '🥉', '4️⃣', '5️⃣'][i-1]
              lines.append(f"| {emoji} | [{repo['name']}]({repo['url']}) | {repo['description'][:50]}{'...' if len(repo['description']) > 50 else ''} | {repo['merged_prs']} PRs | ⭐ {repo['stars']} |")

          if not lines:
              lines.append("| - | No recent PR activity | - | - | - |")

          print('\n'.join(lines))
          PYTHON_SCRIPT

          python3 /tmp/process.py > /tmp/top_repos.md

          # Update README
          if grep -q "<!--START_SECTION:top-repos-->" README.md; then
            # Create the replacement content
            TOP_REPOS=$(cat /tmp/top_repos.md)

            # Use awk to replace content between markers
            awk -v content="$TOP_REPOS" '
              /<!--START_SECTION:top-repos-->/ { print; print content; skip=1; next }
              /<!--END_SECTION:top-repos-->/ { skip=0 }
              !skip { print }
            ' README.md > README.tmp && mv README.tmp README.md
          fi

      - name: Commit changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git diff --quiet --cached || git commit -m "chore: update top active repos"
          git push || true

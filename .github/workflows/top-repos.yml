name: Update Top Active Repos

on:
  schedule:
    - cron: '0 2 * * *'  # Runs daily at 2 AM
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-top-repos:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Generate Top Active Repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: .github/scripts/update_top_repos.sh

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git diff --quiet --cached || git commit -m "chore: update top active repos"
          git push || true

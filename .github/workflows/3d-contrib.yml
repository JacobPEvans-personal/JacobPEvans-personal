name: Generate 3D Contribution Calendar

on:
  schedule:
    - cron: '0 11 * * *'  # Runs daily at 11:00 UTC (~6am ET)
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-validate-{0}', github.run_id) || 'output-branch-push' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_ACTION_JACOBPEVANS_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          ref: output
          token: ${{ steps.app-token.outputs.token }}

      - name: Generate 3D Contribution Calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.2
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          USERNAME: ${{ github.repository_owner }}

      - name: Configure Git for App
        if: github.event_name != 'pull_request'
        env:
          APP_ID: ${{ secrets.GH_ACTION_JACOBPEVANS_APP_ID }}
        run: |
          git config user.name "JacobPEvans-github-actions[bot]"
          git config user.email "${APP_ID}+JacobPEvans-github-actions[bot]@users.noreply.github.com"

      - name: Commit and Push
        if: github.event_name != 'pull_request'
        run: |
          git add profile-3d-contrib/
          if git diff --staged --quiet; then
            echo "No changes to commit, skipping push."
          else
            git commit -m "chore: update 3D contribution calendar"
            git pull --rebase origin output
            git push origin output
          fi

name: Generate 3D Contribution Calendar

on:
  schedule:
    - cron: '0 11 * * *'  # Runs daily at 11:00 UTC (~6am ET)
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-validate-{0}', github.run_id) || 'output-branch-push' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          ref: output
          token: ${{ steps.app-token.outputs.token }}

      - name: Generate 3D Contribution Calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.2
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit via ghcommit-action (GitHub-signed)
        if: github.event_name != 'pull_request'
        uses: planetscale/ghcommit-action@25309d8005ac7c3bcd61d3fe19b69e0fe47dbdde # v0.2.20
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          commit_message: "chore: update 3D contribution calendar"
          repo: ${{ github.repository }}
          branch: output
          file_pattern: 'profile-3d-contrib/*'

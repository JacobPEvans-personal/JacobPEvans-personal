name: Generate 3D Contribution Calendar

on:
  schedule:
    - cron: '0 11 * * *'  # Runs daily at 11:00 UTC (~6am ET)
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          ref: output
          token: ${{ steps.app-token.outputs.token }}

      - name: Generate 3D Contribution Calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.2
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          USERNAME: ${{ github.repository_owner }}

      - name: Configure Git for App
        env:
          APP_ID: ${{ vars.GH_APP_ID }}
        run: |
          git config user.name "JacobPEvans-github-actions[bot]"
          git config user.email "${APP_ID}+JacobPEvans-github-actions[bot]@users.noreply.github.com"

      - name: Commit and Push
        run: |
          git add profile-3d-contrib/
          git diff --staged --quiet || git commit -m "chore: update 3D contribution calendar"
          git push origin output

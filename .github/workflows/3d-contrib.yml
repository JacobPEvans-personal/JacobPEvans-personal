name: Generate 3D Contribution Calendar

on:
  schedule:
    - cron: '0 11 * * *'  # Runs daily at 11:00 UTC (~6am ET)
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: output-branch-push
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          ref: output
          token: ${{ steps.app-token.outputs.token }}

      - name: Generate 3D Contribution Calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.2
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          USERNAME: ${{ github.repository_owner }}

      - name: Open signed PR to output
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: output
          branch: bot/3d-contrib-update
          delete-branch: true
          sign-commits: true
          commit-message: "chore: update 3D contribution calendar"
          title: "chore: update 3D contribution calendar"
          body: "Automated daily 3D contribution calendar refresh."
          add-paths: profile-3d-contrib/

      - name: Squash-merge the PR
        if: steps.cpr.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr merge "$PR" -R ${{ github.repository }} --squash --delete-branch
